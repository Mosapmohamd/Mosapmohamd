name: Metrics
on:
  # Runs automatically every day (adjust the schedule as you like)
  schedule:
    - cron: "0 0 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:
  # Runs on every push to the default branch
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Required — GitHub automatically provides this, no extra token needed
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Mosapmohamd
          template: classic
          filename: metrics.svg
          base: header, activity, community, repositories, metadata

          # Plugins — comment/remove any you don't want
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_lines: yes

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
